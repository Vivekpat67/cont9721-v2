[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contractor-check"
version = "0.1.0"
description = "Vet an Indian construction subcontractor from a quote: APPROVE / HOLD / REJECT with a sourced case file."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rapidfuzz>=3.0",
    # debarment_crawler.py
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "truststore>=0.9",   # OS trust store for TLS (nhidcl.com serves an incomplete certificate chain)
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
contractor-check = "contractor_check.cli:main"

[tool.setuptools]
packages = ["contractor_check"]
py-modules = ["debarment_crawler"]
